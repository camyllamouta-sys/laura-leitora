<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ff7eb6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Laura Descobre">
<title>Laura Descobre</title>
<style>
:root{--rosa:#ff7eb6;--rosa2:#ffd1e6;--roxo:#7c4dff;--azul:#4fc3f7;--verde:#66d17a;--amar:#ffd54f;--laranja:#ffa04d;--tx:#3b2a5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,#fff0f8,#e6f4ff) fixed;min-height:100vh;min-height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden;overscroll-behavior-y:contain}
#app{max-width:640px;margin:0 auto;padding:12px 16px 40px;padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(40px,calc(env(safe-area-inset-bottom) + 24px));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;width:100%}
.grid>*{min-width:0}
button{max-width:100%;overflow-wrap:anywhere}
img,svg{max-width:100%}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:8px}
.avatar{width:64px;height:64px;border-radius:50%;border:4px solid var(--rosa);background:var(--rosa2);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.stars{background:#fff;border-radius:30px;padding:8px 16px;font-weight:bold;font-size:20px;box-shadow:0 3px 0 #0001}
h1{margin:6px 0;font-size:34px;text-align:center;color:var(--roxo);letter-spacing:1px}
h2{text-align:center;margin:8px 0}
.grid{display:grid;gap:14px;margin-top:10px}
.g2{grid-template-columns:1fr 1fr}
.btn{border:0;border-radius:24px;padding:18px 12px;font:inherit;font-size:24px;font-weight:bold;color:#fff;box-shadow:0 6px 0 #0003;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0003}
.big{padding:34px 12px;font-size:30px}
.c1{background:var(--rosa)}.c2{background:var(--azul)}.c3{background:var(--verde)}.c4{background:var(--laranja)}.c5{background:var(--roxo)}.c6{background:#f06292}
.back{background:#fff;color:var(--tx);font-size:18px;padding:10px 16px;border-radius:20px;border:0;box-shadow:0 3px 0 #0002;cursor:pointer;font-weight:bold}
.card{background:#fff;border-radius:28px;padding:18px;box-shadow:0 6px 0 #0001;text-align:center;margin-top:10px}
.emoji{font-size:96px;line-height:1.1}
.q{font-size:26px;font-weight:bold;margin:8px 0}
.opt{background:#fff;border:4px solid var(--rosa2);border-radius:24px;font:inherit;font-size:40px;font-weight:bold;padding:14px 8px;cursor:pointer;color:var(--tx);box-shadow:0 5px 0 #0002}
.opt:active{transform:translateY(3px)}
.opt.ok{background:#c8f7d0;border-color:var(--verde)}
.opt.no{background:#ffe0e0;border-color:#ff8a80}
.tile{display:inline-block;background:var(--amar);border-radius:20px;padding:10px 22px;font-size:54px;font-weight:bold;margin:4px;box-shadow:0 5px 0 #0002;cursor:pointer}
.tile small{font-size:22px;display:block;opacity:.7}
.plus{font-size:44px;font-weight:bold;vertical-align:middle}
.mic{background:var(--roxo);color:#fff;border:0;border-radius:50%;width:84px;height:84px;font-size:40px;box-shadow:0 6px 0 #0003;cursor:pointer}
.mic.on{background:#e53935;animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.vowel{font-size:64px;font-weight:bold;color:#fff;border-radius:24px;padding:10px;cursor:pointer;box-shadow:0 6px 0 #0003;border:0;font-family:inherit}
.vowel span{display:block;font-size:46px}
.vowel small{display:block;font-size:20px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px auto;max-width:360px}
.cell{background:#fff8e1;border:3px solid var(--amar);border-radius:10px;aspect-ratio:1;font-size:34px;display:flex;align-items:center;justify-content:center}
.grupo{display:inline-block;background:#fff8e1;border:3px dashed var(--amar);border-radius:18px;padding:6px 10px;margin:4px;font-size:34px;max-width:46%}
.msg{min-height:64px;font-size:24px;font-weight:bold;color:var(--roxo);margin-top:10px}
#confete{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pc{position:absolute;top:-30px;font-size:30px;animation:cai 2.2s linear forwards}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg)}}
.hide{display:none}
#premio{position:fixed;inset:0;background:#fffffff2;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:bold;color:var(--roxo);padding:24px}
#premio.hide{display:none}
.fig{background:#fff;border:3px solid var(--amar);border-radius:16px;font-size:34px;padding:6px 0;text-align:center;min-width:0}
.fig.off{filter:grayscale(1);opacity:.35;border-style:dashed}
.lista{background:#fff;border-radius:18px;padding:10px 14px;margin:8px 0;text-align:left;font-size:18px}
.lista b{color:var(--roxo)}
.dia{width:100%;margin:6px 0;font-size:26px}
.dia.hoje{border-color:var(--verde);background:#eaffee}
.balao{width:110px;height:136px;border-radius:50% 50% 48% 48%;margin:0 auto 34px;position:relative;box-shadow:inset -12px -12px 0 #0002}
.balao:after{content:'';position:absolute;bottom:-28px;left:50%;width:3px;height:30px;background:#888}
.balao.mini{width:56px;height:70px;margin:0 auto 20px;box-shadow:inset -6px -6px 0 #0002}
.balao.mini:after{bottom:-16px;height:18px}
.enc{background:#fff;border:4px solid var(--rosa2);border-radius:22px;padding:10px 6px;cursor:pointer;box-shadow:0 5px 0 #0002;font:inherit;color:var(--tx)}
.enc:active{transform:translateY(3px)}
.enc .w{font-size:26px;font-weight:bold}
.enc .p{font-size:15px;opacity:.75}
.enc .t{font-size:17px;color:var(--roxo)}
.enc .em{font-size:52px;line-height:1.2}
.nota{font-size:14px;opacity:.7;text-align:center;margin-top:16px}
#premio{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));overflow-y:auto}
/* telas pequenas (iPhone SE, Androids de 320-360px) */
@media (max-width:380px){
  #app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
  h1{font-size:27px}
  .stars{font-size:17px;padding:6px 12px}
  .avatar{width:54px;height:54px}
  .btn{font-size:20px;padding:14px 8px}
  .big{padding:26px 8px;font-size:25px}
  .emoji{font-size:76px}
  .q{font-size:22px}
  .opt{font-size:32px;padding:12px 4px;border-width:3px}
  .tile{font-size:42px;padding:8px 14px}
  .vowel{font-size:52px}.vowel span{font-size:36px}
  .cell{font-size:26px}
  .grupo{font-size:28px}
  .msg{font-size:20px}
  .card{padding:12px;border-radius:22px}
  .enc .em{font-size:42px}.enc .w{font-size:22px}
  .dia{font-size:22px}
  .mic{width:72px;height:72px;font-size:34px}
}
/* telas baixas / celular deitado */
@media (max-height:520px){
  .emoji{font-size:56px}
  .big{padding:16px 8px}
  .btn{padding:10px 8px}
  h1{font-size:24px;margin:2px 0}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="avatar"><img src="laura.png" alt="Laura" onerror="this.parentNode.textContent='👧'"></div>
    <div class="stars" onclick="album()" style="cursor:pointer">⭐ <span id="nstars">0</span></div>
  </header>
  <main id="tela"></main>
</div>
<div id="confete"></div>
<div id="premio" class="hide"></div>

<script>
/* ============ VOZ ============ */
let vozPT=null,vozEN=null;
function carregarVoz(){
  const vs=speechSynthesis.getVoices();
  const v=vs.filter(x=>/^pt/i.test(x.lang));
  vozPT=v.find(x=>/pt-BR/i.test(x.lang)&&/(female|maria|francisca|luciana|google)/i.test(x.name))||v.find(x=>/pt-BR/i.test(x.lang))||v[0]||null;
  vozEN=vs.find(x=>/^en-US/i.test(x.lang)&&/(female|zira|samantha|jenny|aria|google)/i.test(x.name))||vs.find(x=>/^en/i.test(x.lang))||null;
}
if('speechSynthesis' in window){carregarVoz();speechSynthesis.onvoiceschanged=carregarVoz;}
function vozPara(lang){try{const vs=speechSynthesis.getVoices(),L=lang.toLowerCase(),p=L.slice(0,2);
  return vs.find(x=>x.lang.replace('_','-').toLowerCase()===L)||vs.find(x=>x.lang.toLowerCase().startsWith(p))||null;}catch(e){return null;}}
/* Leitura automática das opções: depois da pergunta, a voz lê cada opção para a Laura escolher */
let opcoesPend=null,opcoesAtual=null,leituraId=0;
function vozDe(lang){return /^en/i.test(lang)?vozEN:(/^pt/i.test(lang)?vozPT:vozPara(lang));}
function lerOpcoes(lista,id,i){
  if(id!==leituraId||i>=lista.length)return;
  const [t,lang]=lista[i],u=new SpeechSynthesisUtterance(t);u.lang=lang;
  const vz=vozDe(lang);if(vz)u.voice=vz;u.rate=0.82;u.pitch=1.15;
  u.onend=()=>setTimeout(()=>lerOpcoes(lista,id,i+1),250);
  speechSynthesis.speak(u);
}
function coletaOpcoes(){
  opcoesPend=null;opcoesAtual=null;
  try{const l=[];
    T.querySelectorAll('.opt').forEach(b=>{
      const t=String(b.textContent||'').replace(/[^\p{L}\p{N}\s,.'!?-]/gu,'').replace(/\s+/g,' ').trim();
      if(t)l.push([t,b.dataset&&b.dataset.en?'en-US':'pt-BR']);});
    if(l.length>=2&&l.length<=6){l.unshift(['Escolha:','pt-BR']);opcoesAtual=l;opcoesPend=l;}
  }catch(e){}
}
if(typeof document.addEventListener==='function')document.addEventListener('click',e=>{if(e.target&&e.target.id==='ouv')opcoesPend=opcoesAtual;},true);
function falar(txt,fim,lang){
  if(!('speechSynthesis' in window)){fim&&fim();return;}
  speechSynthesis.cancel();
  const meu=++leituraId,ops=(!fim&&opcoesPend)?opcoesPend:null;opcoesPend=null;
  const u=new SpeechSynthesisUtterance(txt);
  lang=lang||'pt-BR';u.lang=lang;
  const vz=vozDe(lang);if(vz)u.voice=vz;u.rate=0.82;u.pitch=1.15;
  if(fim||ops)u.onend=()=>{if(meu!==leituraId)return;if(fim)fim();else lerOpcoes(ops,meu,0);};
  speechSynthesis.speak(u);
}
/* ============ RECONHECIMENTO (voz da Laura) ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,'').trim();}
function ouvir(alvos,cb,lang){ // cb(true|false|null) null = sem microfone
  if(!SR){cb(null);return;}
  const r=new SR();r.lang=lang||'pt-BR';r.maxAlternatives=6;r.interimResults=false;
  let done=false;
  r.onresult=e=>{done=true;const alts=[...e.results[0]].map(a=>norm(a.transcript));
    cb(alts.some(t=>alvos.some(a=>t.split(' ').includes(norm(a))||t===norm(a)||t.includes(norm(a)))));};
  r.onerror=()=>{if(!done){done=true;cb(null);}};
  r.onend=()=>{if(!done){done=true;cb(false);}};
  try{r.start();}catch(e){cb(null);}
  return r;
}
function ouvirLivre(cb,lang,cru){ // cb(lista de falas|null); cru=true mantém o texto original
  if(!SR){cb(null);return;}
  const r=new SR();r.lang=lang||'pt-BR';r.maxAlternatives=6;r.interimResults=false;
  let done=false;
  r.onresult=e=>{done=true;cb([...e.results[0]].map(a=>cru?a.transcript.trim():norm(a.transcript)));};
  r.onerror=ev=>{if(!done){done=true;cb(ev&&(ev.error==='no-speech'||ev.error==='aborted')?[]:null);}};
  r.onend=()=>{if(!done){done=true;cb([]);}};
  try{r.start();}catch(e){cb(null);}
  return r;
}
/* ============ PROGRESSO ============ */
let estrelas=0;try{estrelas=+localStorage.getItem('ll_estrelas')||0;}catch(e){}
const elN=document.getElementById('nstars');elN.textContent=estrelas;
let extra='';
function ganhar(){estrelas++;elN.textContent=estrelas;try{localStorage.setItem('ll_estrelas',estrelas);}catch(e){}confete();
  if(estrelas%5===0){ // figurinha a cada 5 estrelas; prêmio 1 a cada 50; prêmio 2 ao completar o álbum (200)
    const p2=estrelas%200===0,p1=estrelas%50===0;
    const t=p2?`Uau, Laura! Você completou o álbum com ${estrelas} estrelas! Você ganhou o prêmio número 2: ${premio2()}!`
      :p1?`Uau! Você juntou ${estrelas} estrelas! Você ganhou um troféu e um prêmio: ${premio()}!`:'Você ganhou uma figurinha nova!';
    extra=' '+t;mostraPremio(p2?'🎁':p1?'🏆':FIGS[(estrelas/5-1)%FIGS.length],(p1||p2)?t:'Figurinha nova!');
  }}
let stats={};try{stats=JSON.parse(localStorage.getItem('ll_stats')||'{}');}catch(e){}
function reg(cat,item,ok){const k=cat+'|'+item;const s=stats[k]||(stats[k]={a:0,e:0});if(ok)s.a++;else s.e++;try{localStorage.setItem('ll_stats',JSON.stringify(stats));}catch(e){}}
function premio(){try{return localStorage.getItem('ll_premio')||'um prêmio combinado com a mamãe';}catch(e){return 'um prêmio combinado com a mamãe';}}
function premio2(){try{return localStorage.getItem('ll_premio2')||'o prêmio número 2 combinado com a mamãe';}catch(e){return 'o prêmio número 2 combinado com a mamãe';}}
function confete(){
  const c=document.getElementById('confete');const em=['⭐','🎉','🌟','💖','🎈','✨'];
  for(let i=0;i<24;i++){const s=document.createElement('div');s.className='pc';s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.6+'s';c.appendChild(s);setTimeout(()=>s.remove(),3200);}
}
const PARABENS_LER=[
 'Parabéns, Laura! Você acertou! Mais uma vitória! Você está cada vez mais perto de aprender a ler!',
 'Muito bem, Laura! Mais uma vitória! Você está ficando uma leitora de verdade!',
 'Isso mesmo, Laura! Você conseguiu! Cada dia mais perto de ler sozinha!',
 'Uau, Laura! Acertou de novo! Mais uma vitória para a nossa leitora!'];
const PARABENS_MAT=[
 'Parabéns, Laura! Você acertou! Mais uma vitória! Você está cada vez mais craque em números!',
 'Muito bem, Laura! Mais uma vitória! Você é boa de conta!',
 'Isso mesmo, Laura! Você conseguiu! Cada dia mais esperta com os números!'];
const TENTE=['Quase, Laura! Vamos tentar de novo, você consegue!','Hummm, tente outra vez, Laura. Eu acredito em você!'];
let ci=0;const pick=a=>{let m=a[(ci++)%a.length];if(extra&&a!==TENTE){m+=extra;extra='';}return m;};
const sorteia=a=>a[Math.floor(Math.random()*a.length)];
function embaralha(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ============ DADOS ============ */
const VOGAIS=[
 {l:'A',p:'abelha',e:'🐝',c:'c1'},{l:'E',p:'escada',e:'🪜',c:'c2'},{l:'I',p:'igreja',e:'⛪',c:'c3'},
 {l:'O',p:'ovo',e:'🥚',c:'c4'},{l:'U',p:'uva',e:'🍇',c:'c5'}];
const COMECA=[
 {p:'abelha',e:'🐝',l:'A'},{p:'avião',e:'✈️',l:'A'},{p:'escada',e:'🪜',l:'E'},{p:'elefante',e:'🐘',l:'E'},
 {p:'igreja',e:'⛪',l:'I'},{p:'ilha',e:'🏝️',l:'I'},{p:'ovo',e:'🥚',l:'O'},{p:'olho',e:'👁️',l:'O'},
 {p:'uva',e:'🍇',l:'U'},{p:'urso',e:'🐻',l:'U'}];
const PALAVRAS=[
 ['ba','la','🍬'],['bo','la','⚽'],['va','ca','🐄'],['ga','to','🐱'],['pa','to','🦆'],['lu','a','🌙'],
 ['ca','sa','🏠'],['bo','ca','👄'],['sa','po','🐸'],['bo','lo','🎂'],['ma','la','🧳'],['da','do','🎲'],
 ['fa','da','🧚'],['pi','pa','🪁'],['lu','va','🧤'],['ve','la','🕯️'],['ra','to','🐭'],['ma','pa','🗺️'],
 ['co','po','🥛'],['si','no','🔔'],['lo','bo','🐺'],['pe','ra','🍐'],['mo','to','🏍️'],['te','la','📺']
].map(([a,b,e])=>({s:[a,b],p:a+b,e}));
const CONS='b c d f g l m n p r s t v'.split(' ');
const SILMAP={b:'ba be bi bo bu',c:'ca co cu',d:'da de di do du',f:'fa fe fi fo fu',g:'ga go gu',l:'la le li lo lu',m:'ma me mi mo mu',n:'na ne ni no nu',p:'pa pe pi po pu',r:'ra re ri ro ru',s:'sa se si so su',t:'ta te ti to tu',v:'va ve vi vo vu'};
const NOMES=['zero','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez'];
const OBJ=['🌸','🍎','⭐','🐟','🎈','🍓','🚗','🦋'];

/* ============ TELAS ============ */
const T=document.getElementById('tela');
function tela(h){speechSynthesis.cancel();T.innerHTML=h;coletaOpcoes();}
function voltar(fn,rot){return `<button class="back" onclick="${fn}()">⬅ ${rot||'Voltar'}</button>`;}

function home(){
  tela(`<h1>🌈 Laura Descobre</h1>
  <div class="grid">
    <button class="btn big c1" onclick="menuPT()">📚 Português</button>
    <button class="btn big c2" onclick="menuMAT()">🔢 Matemática</button>
    <button class="btn big c3" onclick="ingles()">🇺🇸 Inglês</button>
    <div class="grid g2" style="margin-top:0">
      <button class="btn c5" onclick="menuMag()">✨ Palavras mágicas</button>
      <button class="btn c6" onclick="diario()">📔 Diário da Laura</button>
    </div>
    <button class="btn c2" onclick="amoMenu()">❤️ Eu te amo no mundo</button>
    <button class="btn c3" onclick="lembretes()">🔔 Lembretes</button>
    <button class="btn c4" onclick="album()">🏆 Meus prêmios</button>
  </div>
  <p style="text-align:center;margin-top:24px"><button class="back" onclick="pais()">👨‍👩‍👧 Área dos pais</button></p>`);
  falar('Oi, Laura! Vamos aprender hoje? Escolha Português, Matemática, Inglês, Palavras mágicas ou o seu Diário.');
}
function menuPT(){
  tela(`${voltar('home')}<h2>📚 Português</h2>
  <div class="grid g2">
    <button class="btn c1" onclick="vogais()">🔤 Ouvir as vogais</button>
    <button class="btn c3" onclick="comeca()">🖼️ Com que letra começa?</button>
    <button class="btn c4" onclick="familias()">🎵 Família das sílabas</button>
    <button class="btn c5" onclick="juntar()">🧩 Juntar sílabas</button>
    <button class="btn c6" onclick="rimas()">🎶 Rimas</button>
    <button class="btn c2" onclick="rimaFrase()">🎤 Rimas com frases</button>
    <button class="btn c3" onclick="generoMenu()">🐾 Macho e fêmea</button>
    <button class="btn c4" onclick="silabas3()">👏 Palavras de 3 sílabas</button>
  </div>`);
  falar('Português! O que vamos fazer?');
}
function menuMAT(){
  tela(`${voltar('home')}<h2>🔢 Matemática</h2>
  <div class="grid g2">
    <button class="btn c2" onclick="contar()">🌷 Quantos tem?</button>
    <button class="btn c3" onclick="somar()">➕ Contas de mais</button>
    <button class="btn c4" onclick="maior()">⚖️ Quem tem mais?</button>
    <button class="btn c5" onclick="numeros()">👂 Ouvir os números</button>
    <button class="btn c1" onclick="relogio()">🕐 Relógio</button>
    <button class="btn c6" onclick="diasMenu()">📅 Dias da semana</button>
  </div>`);
  falar('Matemática! O que vamos fazer?');
}

/* ---- Vogais ---- */
function vogais(){
  tela(`${voltar('menuPT')}<h2>🔤 Toque na vogal</h2>
  <div class="grid g2">${VOGAIS.map((v,i)=>`<button class="vowel ${v.c}" onclick="vogal(${i})">${v.l}<span>${v.e}</span><small>${v.p}</small></button>`).join('')}</div>`);
  falar('Toque em cada vogal para ouvir.');

function nivelMax(){return Math.min(10,5+Math.floor(estrelas/10));}
function opcoesNum(certo,max){
  const s=new Set([certo]);while(s.size<3){const n=Math.max(0,Math.min(max+1,certo+Math.floor(Math.random()*5)-2));s.add(n);}
  return embaralha([...s]);
}

      document.getElementById('msg').textContent='🎉 '+m;falar(`${fala} ${m}`,()=>setTimeout(aoAcertar,600));}
    else{b.classList.add('no');if(cat)reg(cat,item,false);const m=pick(TENTE);document.getElementById('msg').textContent=m;falar(m);}
  });
}

  const n=1+Math.floor(Math.random()*nivelMax());const e=sorteia(OBJ);

  const mx=nivelMax();const a=1+Math.floor(Math.random()*(mx-1)),b=1+Math.floor(Math.random()*(mx-a));

function rimaOk(t,k,lista){ // t = palavra falada (normalizada), k = palavra da frase (normalizada)
  if(t.length<3||t===k)return false;
  if(lista.split(' ').map(norm).includes(t))return true;
  let n=0;while(n<t.length&&n<k.length&&t[t.length-1-n]===k[k.length-1-n])n++;
  return n>=2&&n>=Math.min(3,Math.min(t.length,k.length)-1);
}
let fraseUlt=-1;
function rimaFrase(){
  let i;do{i=Math.floor(Math.random()*FRASES.length);}while(i===fraseUlt);fraseUlt=i;
  const [fr,em,ks]=FRASES[i];let tent=0,fim=false,ops=false;
  const pals=fr.split(' ').map(norm);
  const dest=fr.split(' ').map(w=>ks.some(k=>norm(k[0])===norm(w))?`<b style="color:var(--roxo)">${w}</b>`:w).join(' ');
  const acha=p=>ks.find(k=>rimaOk(p,norm(k[0]),k[1]));
  const ex=sorteia(ks),exr=sorteia(ex[1].split(' '));
  const certas=ks.flatMap(k=>k[1].split(' '));
  tela(`${voltar('menuPT')}
  <div class="card"><div class="emoji">${em}</div>
    <div class="q">${dest}</div>
    <div style="font-size:16px">Diga uma palavra que <b>rime</b> com uma das palavras roxas!</div>
    <button class="back" id="ouv">🔊 Ouvir</button>
    <p><button class="mic" id="mic">🎤</button></p></div>
  <div class="grid" id="opc" style="grid-template-columns:repeat(3,1fr)"></div>
  <div class="msg" id="msg"></div>
  <p style="text-align:center"><button class="back" id="prox">Outra frase ➡</button></p>`);
  const msg=document.getElementById('msg');
  const perg=()=>falar(`${fr}. Diga uma palavra que rime com ${ks.map(k=>k[0]).join(' ou ')}.`);
  perg();document.getElementById('ouv').onclick=perg;document.getElementById('prox').onclick=rimaFrase;
  const acerto=(p,k)=>{if(fim)return;fim=true;reg('Rimas com frases',fr,true);ganhar();const m=pick(PARABENS_RIMA);
    msg.textContent=`🎉 ${p} rima com ${k}! ${m}`;falar(`${p} rima com ${k}! ${m}`,()=>setTimeout(rimaFrase,800));};
  const opcoes=()=>{if(ops)return;ops=true;
    const ca=sorteia(certas);
    const dis=embaralha([...new Set(FRASES.flatMap(f=>f[2].flatMap(k=>k[1].split(' '))))]).filter(w=>!certas.includes(w)&&!pals.includes(norm(w))&&!acha(norm(w))).slice(0,2);
    const box=document.getElementById('opc');
    box.innerHTML=embaralha([ca,...dis]).map(w=>`<button class="opt" style="font-size:22px" data-w="${w}">${w}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const w=b.dataset.w,k=acha(norm(w||''));if(k)acerto(w,k[0]);else{b.classList.add('no');erro();}});
    coletaOpcoes();};
  const erro=()=>{tent++;reg('Rimas com frases',fr,false);
    if(tent>=3){msg.innerHTML=caixaApoio()+`<div>Exemplo: ${exr} rima com ${ex[0]}</div>`;opcoes();falar(`${APOIO} Por exemplo: ${exr} rima com ${ex[0]}.`);}
    else if(tent===2){msg.textContent=`Escute com atenção: ${ex[0]}, ${exr}. Rimam! Tente de novo, você consegue!`;opcoes();falar(`Escute com atenção, Laura. ${ex[0]}, ${exr}. Rimam! Tente de novo, você consegue!`);}
    else{const m=pick(TENTE);msg.textContent=m;falar(m);}};
  const mic=document.getElementById('mic');
  mic.onclick=()=>{speechSynthesis.cancel();mic.classList.add('on');
    ouvirLivre(alts=>{mic.classList.remove('on');
      if(alts===null){msg.textContent='O microfone não está disponível aqui. Toque na palavra! 👇';opcoes();falar('Toque na palavra que rima!');return;}
      if(!alts.length){msg.textContent='Não escutei. Aperte o microfone e fale mais alto! 🎤';falar('Não escutei. Aperte o microfone e fale mais alto!');return;}
      const toks=[...new Set(alts.flatMap(t=>t.split(' ')))].filter(t=>t.length>=3&&!pals.includes(t));
      for(const t of toks){const k=acha(t);if(k){acerto(t,k[0]);return;}}
      erro();});};
}

      seq(sils.map(s=>s+',').concat([pal+'.','Preste atenção, Laura! Você é inteligente e consegue! Tente de novo.']));}

    else{const m=pick(TENTE);msg.textContent=m;falar(m);}};
  const mic=document.getElementById('mic');

  const p=DIARIO[i];let fim=false;
  if(p.so){const dd=(diarioLer()[hojeStr()]||{})[p.so[0]];if(dd!==p.so[1]){diario(i+1);return;}}
  tela(`${voltar('home')}<h2>📔 Diário da Laura</h2>
  <div style="text-align:center;font-size:15px;opacity:.7">Pergunta ${i+1} de ${DIARIO.length}</div>
  <div class="card"><div class="emoji">📔</div><div class="q">${p.q}</div><button class="back" id="ouv">🔊 Ouvir</button>
    ${p.voz?'<p><button class="mic" id="mic">🎤</button></p><div style="font-size:16px">Conte com a sua voz, ou toque!</div>':''}</div>
  <div class="grid g2">${p.o.map(x=>`<button class="opt" style="font-size:20px" data-r="${x[1]}"><span style="font-size:40px">${x[0]}</span><br>${x[1]}</button>`).join('')}</div>
  <div class="msg" id="msg"></div>
  <p style="text-align:center"><button class="back" id="pul">Pular ➡</button></p>`);
  const msg=document.getElementById('msg');
  const perg=()=>falar(p.q);perg();document.getElementById('ouv').onclick=perg;
  document.getElementById('pul').onclick=()=>diario(i+1);
  const resp=(v,fala)=>{if(fim)return;fim=true;diarioSalva(p.id,v);msg.textContent=fala;falar(fala,()=>setTimeout(()=>diario(i+1),500));};
  T.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const v=b.dataset.r||'';b.classList.add('ok');resp(v,(p.r&&p.r[v])||sorteia(CARINHO));});
  if(p.voz){const mic=document.getElementById('mic');
    mic.onclick=()=>{speechSynthesis.cancel();mic.classList.add('on');
      ouvirLivre(alts=>{mic.classList.remove('on');
        if(alts===null){msg.textContent='O microfone não está disponível aqui. Toque em uma resposta! 👇';falar('Toque em uma resposta!');return;}
        if(!alts.length){msg.textContent='Não escutei. Aperte o microfone e conte de novo! 🎤';falar('Não escutei. Aperte o microfone e conte de novo!');return;}
        resp(alts[0],'Que legal, Laura! Você disse: '+alts[0]+'. '+sorteia(CARINHO));},'pt-BR',true);};}
}

/* ============ RELÓGIO ============ */
const HORAS=['doze','uma','duas','três','quatro','cinco','seis','sete','oito','nove','dez','onze'];
function relogioSVG(h,m){
  let nums='';
  for(let i=1;i<=12;i++){const a=i/12*2*Math.PI;nums+=`<text x="${(100+76*Math.sin(a)).toFixed(1)}" y="${(100-76*Math.cos(a)+7).toFixed(1)}" text-anchor="middle" font-size="22" font-weight="bold" fill="#3b2a5a">${i}</text>`;}
  const ah=((h%12)+m/60)/12*2*Math.PI,am=m/60*2*Math.PI;
  return `<svg viewBox="0 0 200 200" width="230" height="230"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#ff7eb6" stroke-width="8"/>${nums}
  <line x1="100" y1="100" x2="${(100+44*Math.sin(ah)).toFixed(1)}" y2="${(100-44*Math.cos(ah)).toFixed(1)}" stroke="#e53935" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="${(100+66*Math.sin(am)).toFixed(1)}" y2="${(100-66*Math.cos(am)).toFixed(1)}" stroke="#4fc3f7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="6" fill="#3b2a5a"/></svg>`;
}
function relogio(){
  const meia=estrelas>=20&&Math.random()<.5;
  const h=1+Math.floor(Math.random()*12),v=meia?h+.5:h;
  const rot=x=>Number.isInteger(x)?(x===1?'1 hora':x+' horas'):Math.floor(x)+' e meia';
  const fal=x=>Number.isInteger(x)?(x===1?'uma hora':HORAS[x%12]+' horas'):HORAS[Math.floor(x)%12]+' e meia';
  const s=new Set([v]);while(s.size<3){const o=1+Math.floor(Math.random()*12);s.add(meia?o+.5:o);}
  const ops=embaralha([...s]);
  tela(`${voltar('menuMAT')}
  <div class="card">${relogioSVG(h,meia?30:0)}<div class="q">Que horas são, Laura?</div>
    <div style="font-size:16px">O ponteiro <b style="color:#e53935">vermelho</b> (pequeno) mostra a hora.</div>
    <button class="back" onclick="falar('Que horas são, Laura?')">🔊 Ouvir</button></div>
  <div class="grid" style="grid-template-columns:repeat(3,1fr)">${ops.map(x=>`<button class="opt" style="font-size:22px" data-v="${x}">${rot(x)}</button>`).join('')}</div>
  <div class="msg" id="msg"></div>`);
  falar('Que horas são, Laura? Olhe o ponteiro vermelho.');
  respostaNum(v,ops,relogio,`${fal(v)}!`,'Relógio',rot(v));
}

/* ============ DIAS DA SEMANA ============ */
const DIAS=['segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado','domingo'];
const hojeIdx=()=>(new Date().getDay()+6)%7;
function seq(lista,i){i=i||0;if(i<lista.length)falar(lista[i],()=>setTimeout(()=>seq(lista,i+1),250));}
function diasMenu(){
  tela(`${voltar('menuMAT')}<h2>📅 Dias da semana</h2>
  <div class="grid">
    <button class="btn c1 big" onclick="diasOuvir()">👂 Ouvir os dias</button>
    <button class="btn c5 big" onclick="diasJogo()">🎮 Jogar</button>
  </div>`);
}
function diasOuvir(){
  tela(`<button class="back" onclick="diasMenu()">⬅ Voltar</button><h2>📅 Toque no dia</h2>
  ${DIAS.map((d,i)=>`<button class="opt dia ${i===hojeIdx()?'hoje':''}" onclick="falar('${d}')">${d}${i===hojeIdx()?' ⭐ hoje':''}</button>`).join('')}
  <p style="text-align:center"><button class="btn c3" onclick="seq(DIAS)">▶ Ouvir a semana toda</button></p>`);
  falar(`Hoje é ${DIAS[hojeIdx()]}.`);
}
function diasJogo(){
  const tipo=Math.floor(Math.random()*3);let i=Math.floor(Math.random()*7),q,r;
  if(tipo===0){q=`Hoje é ${DIAS[i]}. Que dia vem depois?`;r=(i+1)%7;}
  else if(tipo===1){q=`Que dia vem antes de ${DIAS[i]}?`;r=(i+6)%7;}
  else{q='Que dia é hoje?';r=hojeIdx();}
  const s=new Set([r]);while(s.size<3)s.add(Math.floor(Math.random()*7));
  const ops=embaralha([...s]);
  tela(`<button class="back" onclick="diasMenu()">⬅ Voltar</button>
  <div class="card"><div class="emoji">📅</div><div class="q">${q}</div>
    <button class="back" id="ouv">🔊 Ouvir</button></div>
  ${ops.map(x=>`<button class="opt dia" data-v="${x}">${DIAS[x]}</button>`).join('')}
  <div class="msg" id="msg"></div>`);
  document.getElementById('ouv').onclick=()=>falar(q);falar(q);
  respostaNum(r,ops,diasJogo,`${DIAS[r]}!`,'Dias da semana',q);
}

/* ============ ÁREA DOS PAIS ============ */
function pais(){
  const a=6+Math.floor(Math.random()*4),b=6+Math.floor(Math.random()*4);
  tela(`${voltar('home')}<h2>👨‍👩‍👧 Área dos pais</h2>
  <div class="card"><div class="q">Para entrar: quanto é ${a} + ${b}?</div>
    <input id="pg" type="number" inputmode="numeric" style="font-size:30px;width:120px;text-align:center">
    <p><button class="btn c5" id="pgok">Entrar</button></p><div class="msg" id="msg"></div></div>`);
  document.getElementById('pgok').onclick=()=>{
    if(+document.getElementById('pg').value===a+b)paisPainel();
    else document.getElementById('msg').textContent='Resposta errada.';};
}
function zerarStats(){if(confirm('Zerar o histórico de acertos e erros?')){stats={};try{localStorage.removeItem('ll_stats');}catch(e){}paisPainel();}}
function salvarPremio(){const v=document.getElementById('pr').value.trim(),v2=document.getElementById('pr2').value.trim();try{localStorage.setItem('ll_premio',v||'um prêmio combinado com a mamãe');localStorage.setItem('ll_premio2',v2||'o prêmio número 2 combinado com a mamãe');}catch(e){}paisPainel();}
function zerarDiario(){if(confirm('Apagar o diário da Laura?')){try{localStorage.removeItem('ll_diario');}catch(e){}paisPainel();}}
function paisPainel(){
  const ks=Object.keys(stats),porCat={};
  ks.forEach(k=>{const c=k.slice(0,k.indexOf('|')),s=stats[k],x=porCat[c]||(porCat[c]={a:0,e:0});x.a+=s.a;x.e+=s.e;});
  const dif=ks.filter(k=>stats[k].e>0).sort((x,y)=>stats[y].e-stats[x].e).slice(0,8);
  const dd=diarioLer(),dias=Object.keys(dd).sort().reverse().slice(0,7);
  tela(`${voltar('home')}<h2>👨‍👩‍👧 Área dos pais</h2>
  <div class="lista"><b>⭐ Estrelas:</b> ${estrelas}</div>
  <div class="lista"><b>Acertos e erros por atividade</b><br>${Object.keys(porCat).length?Object.keys(porCat).map(c=>`${c}: ✅ ${porCat[c].a} · ❌ ${porCat[c].e}`).join('<br>'):'Ainda sem dados. Deixe a Laura jogar um pouquinho!'}</div>
  <div class="lista"><b>Onde ela mais erra (vale treinar junto)</b><br>${dif.length?dif.map(k=>`${k.replace('|',' → ')}: ❌ ${stats[k].e} · ✅ ${stats[k].a}`).join('<br>'):'Nenhum erro registrado.'}</div>
  <div class="lista"><b>📔 Diário da Laura (últimos dias)</b><br>${dias.length?dias.map(k=>`<b>${k.slice(8)}/${k.slice(5,7)}</b>: ${DIARIO.filter(p=>dd[k][p.id]).map(p=>`${p.t}: ${esc(dd[k][p.id])}`).join(' · ')||'sem respostas'}`).join('<br>'):'Ainda sem registros.'}</div>
  <div class="lista"><b>🏆 Prêmio 1, a cada 50 estrelas</b><br>
    <input id="pr" style="font-size:18px;width:100%;padding:8px;margin:6px 0"><br>
    <b>🎁 Prêmio 2, ao completar o álbum (200 estrelas)</b><br>
    <input id="pr2" style="font-size:18px;width:100%;padding:8px;margin:6px 0"><br>
    <button class="btn c3" style="font-size:18px;padding:10px" onclick="salvarPremio()">Salvar prêmios</button></div>
  <p style="text-align:center"><button class="back" onclick="zerarStats()">Zerar histórico</button> <button class="back" onclick="zerarDiario()">Apagar diário</button></p>`);
  document.getElementById('pr').value=premio();document.getElementById('pr2').value=premio2();
}

home();
</script>
